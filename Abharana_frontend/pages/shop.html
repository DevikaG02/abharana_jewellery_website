        /* Floating WhatsApp button */
        .whatsapp-float {
            position: fixed;
            right: 28px;
            bottom: 28px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #075e54;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .whatsapp-float svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .whatsapp-float:hover {
            background: #128c7e;
            transform: translateY(-4px);
        }

<script src="../js/config.js"></script>
<script>
(() => {
  const API_URL = window.ABHARANA_API_URL || "http://127.0.0.1:8000";
  const grid = document.getElementById("databaseProductGrid");
  if (!grid) return;

  // Category comes from homepage links such as ?category=rings.
  const params = new URLSearchParams(window.location.search);
  const selectedCategory = (params.get("category") || "").trim().toUpperCase();
  const whatsappNumber = "8078177913";

  const normalizeCategory = value => String(value || "")
    .trim().toUpperCase()
    .replace(/[\s-]+/g, "_");

  const resolveImage = value => {
    const src = String(value || "").trim();
    if (src.startsWith("/uploads/")) return `${API_URL}${src}`;
    return src;
  };

  function createCard(product) {
    const card = document.createElement("article");
    card.className = "product-card";

    const imageWrap = document.createElement("div");
    imageWrap.className = "product-image";
    const imageUrl = resolveImage(product.image_url || product.image);
    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = product.name || "Abharana jewellery";
      img.loading = "lazy";
      img.onerror = () => { img.remove(); imageWrap.classList.add("no-product-image"); };
      imageWrap.appendChild(img);
    } else {
      imageWrap.classList.add("no-product-image");
      const placeholder = document.createElement("span");
      placeholder.textContent = "ABHARANA";
      placeholder.setAttribute("aria-label", "Image not available");
      imageWrap.appendChild(placeholder);
    }

    const info = document.createElement("div");
    info.className = "product-info";
    const category = document.createElement("p");
    category.className = "product-category";
    category.textContent = normalizeCategory(product.category).replaceAll("_", " ");
    const title = document.createElement("h3");
    title.textContent = product.name || "Abharana Jewellery";
    const price = document.createElement("p");
    price.className = "price";
    price.textContent = `₹${Number(product.price || 0).toLocaleString("en-IN")}`;
    const enquiry = document.createElement("a");
    enquiry.className = "whatsapp-product";
    enquiry.target = "_blank";
    enquiry.rel = "noopener noreferrer";
    enquiry.textContent = "Enquire ↗";
    enquiry.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(`Hello Abharana, I'm interested in ${product.name || "this jewellery piece"}.`)}`;

    info.append(category, title, price, enquiry);
    card.append(imageWrap, info);
    return card;
  }

  fetch(`${API_URL}/api/products`)
    .then(response => {
      if (!response.ok) throw new Error(`Product API returned ${response.status}`);
      return response.json();
    })
    .then(data => {
      const products = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
      if (!products.length) return; // Keep the original sample collection cards if the DB is empty.

      const visibleProducts = selectedCategory
        ? products.filter(product => normalizeCategory(product.category) === selectedCategory)
        : products;

      if (!visibleProducts.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = `No ${selectedCategory.replaceAll("_", " ").toLowerCase()} are available yet.`;
        grid.replaceChildren(empty);
        return;
      }

      grid.replaceChildren(...visibleProducts.map(createCard));
    })
    .catch(error => console.warn("Could not load database products; showing the existing collection cards.", error));
})();
</script>
